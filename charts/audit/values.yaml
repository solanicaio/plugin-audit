replicaCount: 1

image:
  repository: ghcr.io/openeverest/plugin-audit
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  port: 8080

# Credentials of the OpenEverest user the daemon reads the events as. The host
# doesn't issue plugin service tokens yet (spec 003 §10.4), so the daemon logs
# in with POST /v1/auth/token: once with the password, then with the refresh
# token. Create a Secret with keys "username" and "password", then reference its
# name here.
#
# The events API only returns the events the user may read: read-events on the
# objects they are about, and read on platform-events for logins and logouts.
# The admin role covers both. A dedicated read-only role, in the everest-rbac
# ConfigMap:
#
#   p, role:auditor, instances, read-events, */*/*
#   p, role:auditor, backups, read-events, */*/*
#   p, role:auditor, restores, read-events, */*/*
#   p, role:auditor, backup-imports, read-events, */*/*
#   p, role:auditor, backup-storages, read-events, */*/*
#   p, role:auditor, monitoring-destinations, read-events, */*/*
#   p, role:auditor, installed-extensions, read-events, */*
#   p, role:auditor, plugins, read-events, */*
#   p, role:auditor, namespaces, read-events, */*
#   p, role:auditor, platform-events, read, *
#   g, <username>, role:auditor
auth:
  credentialsSecretName: ""

plugin:
  displayName: "Audit Log"
  description: "Captures OpenEverest lifecycle events and exposes them as a searchable audit log."
  vendor: "OpenEverest"
  enabled: true
  bundlePath: "/main.js"
  extensionPoints:
    - type: route
      path: /audit
      label: Audit Log
    - type: sidebarItem
      path: /audit
      label: Audit Log
      icon: "/icon.png"

  # OpenEverest cluster whose lifecycle events are recorded.
  cluster: main

  # Optional filters for the events API (GET /v1/clusters/{cluster}/events).
  # Empty lists record everything.
  # kinds: object kinds, e.g. Instance, Backup, Restore, User.
  kinds: []
  # reasons: Created, Updated, PhaseChanged, DeletionRequested, Deleted,
  # LoginSucceeded, LoginFailed, Logout.
  reasons: []

  # Optional namespace filter. Leave empty to record the events of every
  # namespace the user may read.
  namespaces: []

# Storage configuration. MVP only supports the embedded SQLite driver; Phase 2
# will add a PostgreSQL backend selectable via storage.driver.
storage:
  driver: sqlite
  sqlite:
    # Mount path of the persistent volume holding audit.db.
    path: /data/audit.db
  persistence:
    enabled: true
    size: 5Gi
    # storageClass: ""
    accessMode: ReadWriteOnce

# Optional override for the Everest API URL. When left empty the backend
# auto-discovers the everest Service via Kubernetes-injected env vars.
# Falls back to http://everest.everest-system.svc.cluster.local:8080.
everestAPIURL: ""

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi
