{{- $driver := .Values.storage.driver }}
{{- if not (has $driver (list "sqlite" "postgres")) }}
{{- fail (printf "storage.driver must be sqlite or postgres, got %q" $driver) }}
{{- end }}
{{- if and (eq $driver "postgres") (not .Values.storage.postgres.uriSecretName) }}
{{- fail "storage.driver=postgres requires storage.postgres.uriSecretName: the name of a Secret with the connection URI under the key \"uri\"" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "audit.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "audit.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # The daemon is the single writer and owns the events cursor, so there must
  # be one replica, for both drivers. Recreate on upgrade so that two pods
  # never run at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "audit.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "audit.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.service.port | quote }}
            - name: AUDIT_DB_DRIVER
              value: {{ $driver | quote }}
            {{- if eq $driver "postgres" }}
            - name: AUDIT_DB_URI
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.storage.postgres.uriSecretName }}
                  key: uri
            {{- else }}
            - name: AUDIT_DB_PATH
              value: {{ .Values.storage.sqlite.path | quote }}
            {{- end }}
            - name: AUDIT_CLUSTER
              value: {{ .Values.plugin.cluster | quote }}
            {{- with .Values.plugin.kinds }}
            - name: AUDIT_KINDS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with .Values.plugin.reasons }}
            - name: AUDIT_REASONS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with .Values.plugin.namespaces }}
            - name: AUDIT_NAMESPACES
              value: {{ join "," . | quote }}
            {{- end }}
            {{- if .Values.everestAPIURL }}
            - name: EVEREST_API_URL
              value: {{ .Values.everestAPIURL | quote }}
            {{- end }}
            {{- with .Values.auth.credentialsSecretName }}
            - name: EVEREST_SERVICE_USER
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: username
            - name: EVEREST_SERVICE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: password
            {{- end }}
          {{- if eq $driver "sqlite" }}
          volumeMounts:
            - name: data
              mountPath: {{ dir .Values.storage.sqlite.path | quote }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.service.port }}
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.service.port }}
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if eq $driver "sqlite" }}
      volumes:
        - name: data
          {{- if .Values.storage.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "audit.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- end }}
